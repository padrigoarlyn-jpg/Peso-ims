<header class="site-header">
    <nav class="navbar">

        <!-- Logo -->
        <div class="nav-left">
            <a href="{{ url_for('employer.dashboard') }}">
                <img src="{{ url_for('static', filename='images/peso_logo.png') }}" alt="PESO Logo" class="nav-logo">
            </a>
            <!-- Mobile Navigation Toggle Button -->
            <button type="button" class="mobile-nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- Navigation -->
        <div class="nav-center">
            <div class="nav-links">

                <!-- HOME -->
                <a href="{{ url_for('employer.dashboard') }}"
                    class="{% if request.endpoint == 'employer.dashboard' %}active{% endif %}">
                    HOME
                </a>

                <!-- JOBS -->
                <a href="{{ url_for('employer.joblisting') }}" class="{% if request.endpoint in [
                        'employer.joblisting',
                        'employer.create_job',
                        'employer.update_job',
                        'employer.delete_job'
                   ] %}active{% endif %}">
                    JOBS
                </a>

                <!-- JOBSEEKERS -->
                <a href="{{ url_for('employer.jobseekerlist') }}" class="{% if request.endpoint in [
                        'employer.jobseekerlist',
                        'employer.applicant_details',
                        'employer.employerjobseeker',
                        'employer.shortlist',
                        'employer.schedule_interview',
                        'employer.reject_applicant',
                        'employer.hire_applicant'
                   ] %}active{% endif %}">
                    JOBSEEKERS
                </a>

                <!-- JOB FAIRS -->
                <a href="{{ url_for('employer.job_fairs') }}" class="{% if request.endpoint in [
                        'employer.job_fairs',
                        'employer.job_fair_details',
                        'employer.register_job_fair',
                        'employer.select_job_fair_jobs',
                        'employer.create_job_fair_job'
                   ] %}active{% endif %}">
                    JOB FAIRS
                </a>

            </div>
        </div>

        <!-- Right Section -->
        <div class="nav-right">

            <!-- Notifications -->
            <div class="notification-menu">

                <button class="notification-toggle" type="button" aria-label="Notifications" aria-expanded="false">

                    <i class="fa-regular fa-bell notif"></i>

                    {% if unread_notifications > 0 %}
                    <span class="notification-badge">
                        {{ unread_notifications }}
                    </span>
                    {% endif %}

                </button>

                <div class="notification-dropdown">

                    <div class="notification-header">
                        <span>Notifications</span>
                        <form action="{{ url_for('mark_all_notifications') }}" method="POST" class="notification-action-form">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button type="submit" class="mark-all-link notification-action-button">Mark all as read</button>
                        </form>
                    </div>

                    {% if notifications %}

                    {% for notification in notifications %}

                    <form action="{{ url_for('read_notification', notification_id=notification.notification_id) }}" method="POST" class="notification-action-form notification-item-form">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="notification-item {% if not notification.is_read %}unread{% endif %}">

                        <div class="notification-title">
                            {{ notification.title }}
                        </div>

                        <div class="notification-message">
                            {{ notification.message }}
                        </div>

                        <small>
                            {{ notification.created_at | local_dt }}
                        </small>

                    </button>
                    </form>

                    {% endfor %}

                    {% else %}

                    <div class="notification-empty">
                        No notifications
                    </div>

                    {% endif %}

                </div>

            </div>

            <!-- Profile -->
            <div class="profile-menu {% if request.endpoint == 'employer.profile' %}has-active-page{% endif %}">

                <button class="profile-menu-toggle" type="button" aria-label="Open profile menu" aria-expanded="false">

                    <img src="{{ url_for('static', filename='uploads/logos/' ~ employer.company_logo) if employer.company_logo else url_for('static', filename='images/pfp_placeholder.png') }}"
                        class="profile" alt="Profile">

                    <i class="fa-solid fa-chevron-down"></i>

                </button>

                <div class="profile-menu-dropdown">

                    <!-- Company Profile -->
                    <a href="{{ url_for('employer.profile') }}"
                        class="{% if request.endpoint == 'employer.profile' %}active{% endif %}">
                        <i class="fa-regular fa-user"></i>
                        Company Profile
                    </a>

                    <!-- Logout -->
                    <form method="POST" action="{{ url_for('auth.logout') }}" class="logout-form">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="logout-link">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</header>
<script src="{{ url_for('static', filename='javascript/notifications_live.js') }}" defer></script>

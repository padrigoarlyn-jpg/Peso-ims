<header class="site-header">
    <nav class="navbar">

        <!-- Logo -->
        <div class="nav-left">
            <a href="#">
                <img src="{{ url_for('static', filename='images/peso_logo.png') }}" alt="PESO Logo" class="nav-logo">
            </a>
            <button type="button" class="mobile-nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- Navigation -->
        <div class="nav-center">
            <div class="nav-links">

                <a href="{{ url_for('jobseeker.dashboard') }}"
                    class="{% if request.endpoint=='jobseeker.dashboard' %}active{% endif %}">
                    HOME
                </a>

                <a href="{{ url_for('jobseeker.joblist') }}"
                    class="{% if request.endpoint=='jobseeker.joblist' %}active{% endif %}">
                    JOB LISTING
                </a>

                <a href="{{ url_for('jobseeker.announcement') }}"
                    class="{% if request.endpoint=='jobseeker.announcement' %}active{% endif %}">
                    ANNOUNCEMENTS
                </a>

                <a href="{{ url_for('jobseeker.application') }}"
                    class="{% if request.endpoint=='jobseeker.application' %}active{% endif %}">
                    REFERRAL STATUS
                </a>

            </div>
        </div>

        <!-- Right Section -->
        <div class="nav-right">

            <!-- Notifications -->
            <div class="notification-menu">

                <button class="notification-toggle" type="button" aria-label="Notifications" aria-expanded="false">

                    <i class="fa-regular fa-bell notif"></i>

                    {% if unread_notifications > 0 %}
                    <span class="notification-badge">
                        {{ unread_notifications }}
                    </span>
                    {% endif %}

                </button>

                <div class="notification-dropdown">

                    <div class="notification-header">
                        <span>Notifications</span>
                        <form action="{{ url_for('mark_all_notifications') }}" method="POST" class="notification-action-form">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button type="submit" class="mark-all-link notification-action-button">Mark all as read</button>
                        </form>
                    </div>

                    {% if notifications %}

                    {% for notification in notifications %}

                    <form action="{{ url_for('read_notification', notification_id=notification.notification_id) }}" method="POST" class="notification-action-form notification-item-form">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="notification-item {% if not notification.is_read %}unread{% endif %}">

                        <div class="notification-title">
                            {{ notification.title }}
                        </div>

                        <div class="notification-message">
                            {{ notification.message }}
                        </div>

                        <small>
                            {{ notification.created_at | local_dt }}
                        </small>

                    </button>
                    </form>

                    {% endfor %}

                    {% else %}

                    <div class="notification-empty">
                        No notifications
                    </div>

                    {% endif %}

                </div>

            </div>

            <!-- Profile -->
            <div class="profile-menu {% if request.endpoint == 'jobseeker.profile' %}has-active-page{% endif %}">

                <button class="profile-menu-toggle" type="button" aria-label="Open profile menu" aria-expanded="false">

                    <img src="{{ url_for('static', filename='uploads/jobseekers/' ~ jobseeker.profile_picture) if jobseeker.profile_picture else url_for('static', filename='images/pfp_placeholder.png') }}" class="profile" alt="Profile">
                    <i class="fa-solid fa-chevron-down"></i>

                </button>

                <div class="profile-menu-dropdown">

                    <a href="{{ url_for('jobseeker.profile') }}"
                        class="{% if request.endpoint == 'jobseeker.profile' %}active{% endif %}">
                        <i class="fa-regular fa-user"></i>
                        My Profile
                    </a>

                    <form method="POST" action="{{ url_for('auth.logout') }}" class="logout-form">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="logout-link">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            Logout
                        </button>
                    </form>

                </div>

            </div>

        </div>

    </nav>
</header>
<script src="{{ url_for('static', filename='javascript/notifications_live.js') }}" defer></script>
